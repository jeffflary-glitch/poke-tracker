<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokéTracker">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161D25" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Jeff's Pokémon Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + tab rail, one centered 960px column; collection reads like a sleeve list, binder like a 9-pocket page */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#16202B; --muted:#5A6676; --line:#D4DAE2;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --t-top:#B8790F; --t-binder:#2457D6; --t-bulk:#6F7C8B; --t-sealed:#8248C2;
  --good:#1D8250; --warn:#A86D12; --bad:#C0392F;
  --foil-a:#7FD3E8; --foil-b:#C8A7F2; --foil-c:#F6D27A;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#161D25; --surface-2:#1C242E; --ink:#E5EAF0; --muted:#93A0AF; --line:#2A3542;
  --accent:#7097FF; --accent-ink:#0E1319; --accent-soft:#1D2A47;
  --t-top:#E4AA3E; --t-binder:#7097FF; --t-bulk:#8E9AA8; --t-sealed:#B485EE;
  --good:#46C084; --warn:#E3A94B; --bad:#F27168;
  --foil-a:#3F9DB3; --foil-b:#8C68C4; --foil-c:#C49A3B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#161D25; --surface-2:#1C242E; --ink:#E5EAF0; --muted:#93A0AF; --line:#2A3542;
  --accent:#7097FF; --accent-ink:#0E1319; --accent-soft:#1D2A47;
  --t-top:#E4AA3E; --t-binder:#7097FF; --t-bulk:#8E9AA8; --t-sealed:#B485EE;
  --good:#46C084; --warn:#E3A94B; --bad:#F27168;
  --foil-a:#3F9DB3; --foil-b:#8C68C4; --foil-c:#C49A3B;
  color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding-block:12px}
.hd h1{font-size:20px;font-weight:800;flex:1;min-width:0}
.hd .stamp{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:17px;font-weight:600;margin-bottom:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:22px 20px;background:var(--surface);border:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(100deg,var(--foil-a),var(--foil-b),var(--foil-c),var(--foil-a));background-size:300% 100%;animation:foil 9s linear infinite}
@keyframes foil{to{background-position:300% 0}}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,9vw,56px);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:var(--muted)}
.hero .sub b{color:var(--ink);font-family:var(--f-mono);font-weight:500}

/* tier breakdown */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin-bottom:14px}
.stack span{height:100%}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tier{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;padding:10px 12px;background:var(--surface-2);border-radius:10px}
.tier i{width:10px;height:10px;border-radius:3px;align-self:center;grid-row:span 2}
.tier .l{font-weight:600}
.tier .v{font-family:var(--f-mono);text-align:right}
.tier .s{font-size:12px;color:var(--muted)}
.tier .c{font-size:12px;color:var(--muted);text-align:right;font-family:var(--f-mono)}
.c-top{background:var(--t-top)} .c-binder{background:var(--t-binder)} .c-bulk{background:var(--t-bulk)} .c-sealed{background:var(--t-sealed)} .c-other{background:var(--line)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .t span{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}

/* hits */
.hits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hits li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.hits li:first-child{border-top:0;padding-top:0}
.hits .nm{font-weight:600;min-width:0}
.hits .px{font-family:var(--f-mono);font-weight:500;text-align:right}
.hits .meta{font-size:12px;color:var(--muted);grid-column:1/-1}

/* collection */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;padding:11px 0;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sortrow select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 14px;padding:12px 14px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--tc,var(--line))}
.row .nm{font-weight:600}
.row .meta{font-size:12.5px;color:var(--muted)}
.row .val{text-align:right}
.row .px{font-family:var(--f-mono);font-weight:500}
.row .qty{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.row .loc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px}
.pin{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-size:12px}
.pin i{width:7px;height:7px;border-radius:50%;background:var(--tc,var(--line))}
.flag{font-size:11.5px;font-weight:600;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:0 7px}
.t-top{--tc:var(--t-top)} .t-binder{--tc:var(--t-binder)} .t-bulk{--tc:var(--t-bulk)} .t-sealed{--tc:var(--t-sealed)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* binder */
.pager{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.pager .pg{font-family:var(--f-display);font-weight:800;font-size:22px}
.pages{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pages button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:12px}
.pages button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pages button.full{background:var(--surface-2)}
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line);max-width:560px;margin:14px auto 0}
.slot{aspect-ratio:63/88;max-width:100%;border-radius:8px;background:var(--surface);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;position:relative}
.slot .sn{position:absolute;top:6px;right:7px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.slot .nm{font-weight:600;font-size:12.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:12px}
.slot .meta{font-size:10.5px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.slot .px{margin-top:auto;font-family:var(--f-mono);font-size:12px;font-weight:500}
.slot.open{border-style:dashed;background:transparent;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.slot.next{border-color:var(--accent);color:var(--accent);font-weight:600}
.slot.fill::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--t-binder)}

/* storage */
.units{display:flex;flex-direction:column;gap:16px}
.unit{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.unit .l{font-weight:600}
.unit .r{font-family:var(--f-mono);font-size:13px;text-align:right}
.unit .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.unit .t{grid-column:1/-1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.unit .t span{display:block;height:100%}
.spots{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.spot{padding:12px;border-radius:10px;border:1px dashed var(--accent);background:var(--accent-soft)}
.spot .v{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent)}

/* grading */
.gcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.gtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-grade{background:var(--good);color:var(--surface)}
.p-gamble{background:var(--warn);color:var(--surface)}
.p-skip{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.gtbl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gtbl div{background:var(--surface-2);border-radius:8px;padding:8px}
.gtbl .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gtbl .v{font-family:var(--f-mono);font-weight:500}
.pos{color:var(--good)} .neg{color:var(--bad)}
.steps{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.steps span{background:var(--surface-2);border-radius:6px;padding:3px 8px}

/* states */
.state{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.state h2{font-size:20px}
.state p{margin:0;max-width:48ch;color:var(--muted)}
.skel{height:14px;border-radius:7px;background:var(--surface-2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.secerr{font-size:13px;color:var(--warn);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.spark{width:100%;height:auto;display:block}
.spark text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
a{color:var(--accent)}

/* card pictures */
.thumb{width:44px;aspect-ratio:63/88;border-radius:4px;background:var(--surface-2);overflow:hidden;flex:none;position:relative}
.thumb img,.art img,.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:34px}
.logo img{object-fit:contain;padding:12%}
.thumb.logo img{padding:6%}
.thumb:not(.has-img)::after{content:"";position:absolute;inset:30% 25%;border-radius:50%;border:2px solid var(--line)}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap:active{background:var(--surface-2)}
.row{grid-template-columns:44px minmax(0,1fr) auto}
.row .thumb{grid-row:span 2}
.row .loc{grid-column:2/-1}
.hits.pics li{grid-template-columns:34px minmax(0,1fr) auto;align-items:center}
.hits.pics .thumb{grid-row:span 2;align-self:start}
.hits.pics .meta{grid-column:2/-1}
.slot .art{position:absolute;inset:0;z-index:1}
.slot .art:not(.has-img){opacity:0;pointer-events:none}
.slot .art.has-img ~ .sn{z-index:2;background:var(--surface);border-radius:4px;padding:0 4px;top:4px;right:4px}
.slot .art.has-img ~ .px{z-index:2;position:absolute;left:4px;bottom:6px;background:var(--surface);border-radius:4px;padding:1px 5px;font-size:11px}
.slot.fill::after{z-index:2}
dialog#detail{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(420px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto}
dialog#detail::backdrop{background:rgba(5,10,15,.6)}
.dhead{display:flex;justify-content:flex-end;padding:10px 10px 0}
.dimg{width:min(260px,68vw);aspect-ratio:63/88;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--surface-2);position:relative}
.dimg:not(.has-img)::after{content:"No picture found";position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.dbody{padding:16px;display:flex;flex-direction:column;gap:12px}
.dbody h2{font-size:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <h1>Jeff's Pokémon Tracker</h1>
      <span class="stamp" id="stamp"></span>
      <button class="btn" id="refresh" type="button" aria-label="Refresh from Google Sheets">Refresh</button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="overview" id="tab-overview">Overview</button>
      <button class="tab" role="tab" data-tab="collection" id="tab-collection">Find a card</button>
      <button class="tab" role="tab" data-tab="binder" id="tab-binder">Binder</button>
      <button class="tab" role="tab" data-tab="grading" id="tab-grading">Grading</button>
      <button class="tab" role="tab" data-tab="storage" id="tab-storage">Storage</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite"></main>
<dialog id="detail" aria-label="Card details"></dialog>

<script>
const SHEET_ID = "143nfwKic9pxbT8e3BtbWnm3pWjFA7IvGOD8aVY8ILy0";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
// The Apps Script web app. "?data=1" returns the sheet as data; without it, the old all-in-one page.
const API = "https://script.google.com/macros/s/AKfycbxkjs8M4ngqGeTfGU3787LDaHR_14qMyPYEdk3aiF5iLovlu1aQYs9Db_NTbfosv2jQCA/exec";
const CACHE_KEY = "pkt-data";
const KEYS = ["collection","storage","grading","log"];
const TIERS = [
  {k:"top", label:"Top loaders", sub:"$20+ · penny sleeve + 35pt"},
  {k:"binder", label:"Binder", sub:"$2–19.99 · Vault X 9-pocket"},
  {k:"bulk", label:"Bulk box", sub:"Under $2 · 3,600-count"},
  {k:"sealed", label:"Sealed", sub:"Sealed shelf"}
];
const S = {data:{}, err:{}, at:{}, tab:"overview", q:"", filter:"all", sort:"value", page:null, mode:"loading", busy:false};

try { const t = localStorage.getItem("pkt-tab"); if (t) S.tab = t; } catch(e) {}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : 0; };
const usd = n => n.toLocaleString("en-US", {style:"currency", currency:"USD"});
const usd0 = n => n.toLocaleString("en-US", {style:"currency", currency:"USD", maximumFractionDigits:0});
const int = n => Math.round(n).toLocaleString("en-US");
const sleep = ms => new Promise(r => setTimeout(r, ms));
function tierOf(loc){
  const l = String(loc||"");
  if (/^buffer/i.test(l) || /top loader/i.test(l)) return "top";
  if (/^binder/i.test(l)) return "binder";
  if (/^bulk/i.test(l)) return "bulk";
  if (/sealed/i.test(l)) return "sealed";
  return "other";
}
function ago(ts){
  if (!ts) return "";
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "Updated just now";
  if (m < 60) return "Updated " + m + " min ago";
  const h = Math.round(m / 60);
  return h < 24 ? "Updated " + h + " hr ago" : "Updated " + new Date(ts).toLocaleDateString();
}

/* ---------- card pictures ---------- */
/* Card pictures come from TCGdex (free card database), matched by set name + card number.
   Sealed items use Jeff's own photo from sealed/photos.json if there is one, otherwise the set's logo.
   The set list and each set's card list are saved on the phone so they load once. */
const TCG = "https://api.tcgdex.net/v2/en";
const IMG = {sets:null, logos:{}, photos:null, maps:{}, loading:{}};
const normName = s => String(s || "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
const normSet = s => String(s || "").replace(/\(.*?\)/g, "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
const numKey = n => { const x = String(n || "").split("/")[0].trim().toLowerCase().replace(/\s+/g, ""); return /^\d+$/.test(x) ? String(+x) : x; };
const hasPic = r => r.tier !== "sealed" && r.num && !/mixed/i.test(r.num) && !/\(count\)/i.test(r.name);
const picAttrs = r => hasPic(r) ? ` data-set="${esc(r.set)}" data-num="${esc(r.num)}"`
  : r.tier === "sealed" ? ` data-sealed="${esc(r.name)}" data-lset="${esc(r.set)}"` : "";
function cacheGet(k, maxAge){ try { const v = JSON.parse(localStorage.getItem(k) || "null"); if (v && Date.now() - v.t < maxAge) return v.d; } catch(e) {} return null; }
function cachePut(k, d){ try { localStorage.setItem(k, JSON.stringify({t:Date.now(), d})); } catch(e) {} }
async function getJSON(url){ const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
function setIdFor(name){
  const n = normSet(name);
  if (!n || !IMG.sets) return null;
  return IMG.sets[n] || (n.endsWith("blackstarpromos") && IMG.sets[n.replace(/blackstarpromos$/, "pblackstarpromos")]) || null;
}
// undefined = not known yet, null = no picture, string = picture address
function lookup(set, num){
  if (!IMG.sets) return undefined;
  const id = setIdFor(set);
  if (!id) return null;
  const m = IMG.maps[id];
  return m ? (m[numKey(num)] || null) : undefined;
}
function loadSets(){
  if (IMG.sets) return Promise.resolve();
  return IMG.loading._sets || (IMG.loading._sets = (async () => {
    let idx = cacheGet("pkt-tcg-sets2", 7 * 864e5);
    if (!idx) {
      try {
        idx = {ids:{}, logos:{}};
        for (const x of await getJSON(TCG + "/sets")) {
          const k = normSet(x.name);
          if (!k || idx.ids[k]) continue;
          idx.ids[k] = x.id;
          if (x.logo) idx.logos[k] = x.logo;
        }
        cachePut("pkt-tcg-sets2", idx);
      } catch(e) { idx = {ids:{}, logos:{}}; }
    }
    IMG.sets = idx.ids; IMG.logos = idx.logos;
  })());
}
function loadSet(id){
  if (IMG.maps[id]) return Promise.resolve();
  return IMG.loading[id] || (IMG.loading[id] = (async () => {
    let m = cacheGet("pkt-tcg-set-" + id, 14 * 864e5);
    if (!m) {
      try {
        m = {};
        for (const c of (await getJSON(TCG + "/sets/" + encodeURIComponent(id))).cards || []) if (c.image) m[numKey(c.localId)] = c.image;
        cachePut("pkt-tcg-set-" + id, m);
      } catch(e) { m = {}; }
    }
    IMG.maps[id] = m;
  })());
}
function loadPhotos(){
  if (IMG.photos) return Promise.resolve();
  return IMG.loading._photos || (IMG.loading._photos = fetch("sealed/photos.json", {cache:"no-cache"})
    .then(r => r.ok ? r.json() : {}).catch(() => ({}))
    .then(m => { IMG.photos = {}; for (const k in m) IMG.photos[normName(k)] = "sealed/" + m[k]; }));
}
// Sealed item: {url, logo} or null; undefined = not known yet
function lookupSealed(name, set){
  if (!IMG.photos || !IMG.sets) return undefined;
  const ph = IMG.photos[normName(name)];
  if (ph) return {url:ph, logo:false};
  const lg = IMG.logos[normSet(set)];
  return lg ? {url:lg + ".webp", logo:true} : null;
}
function putImg(el, url, logo){
  const img = new Image();
  img.alt = ""; img.decoding = "async"; img.loading = "lazy";
  img.onload = () => el.classList.add("has-img");
  if (logo) el.classList.add("logo");
  img.src = url;
  el.appendChild(img);
}
// Fills in every picture box on screen; fetches what it doesn't know yet, then runs again.
function hydrate(root){
  root = root || document;
  const need = new Set();
  let wantSealed = false;
  root.querySelectorAll("[data-set][data-num]:not([data-done])").forEach(el => {
    const u = lookup(el.dataset.set, el.dataset.num);
    if (u === undefined) { need.add(el.dataset.set); return; }
    el.dataset.done = "1";
    if (u) putImg(el, u + "/" + (el.dataset.size || "low") + ".webp", false);
  });
  root.querySelectorAll("[data-sealed]:not([data-done])").forEach(el => {
    const u = lookupSealed(el.dataset.sealed, el.dataset.lset);
    if (u === undefined) { wantSealed = true; return; }
    el.dataset.done = "1";
    if (u) putImg(el, u.url, u.logo);
  });
  if (!need.size && !wantSealed) return;
  Promise.all([loadSets(), wantSealed ? loadPhotos() : null])
    .then(() => Promise.all([...need].map(n => { const id = setIdFor(n); return id ? loadSet(id) : null; })))
    .then(() => hydrate(root));
}

/* ---------- parsing ---------- */
function parse(key, rows){
  const body = rows.slice(1).filter(r => r && r.length && String(r[0]||"").trim());
  if (key === "collection") return body.map((r, i) => {
    const qty = money(r[6]) || 1, price = money(r[7]);
    const total = r[11] ? money(r[11]) : qty * price;
    const m = String(r[9]||"").match(/P\s*(\d+)\s*S\s*(\d+)/i);
    return {i, name:r[0], set:r[1]||"", num:r[2]||"", rarity:r[3]||"", cat:r[4]||"", cond:r[5]||"",
      qty, price, total, date:r[8]||"", loc:r[9]||"", prot:r[10]||"", rec:r[12]||"", req:r[13]||"",
      status:r[14]||"", check:r[15]||"", tier:tierOf(r[9]), page:m?+m[1]:null, slot:m?+m[2]:null,
      sleeve:/^upgrade/i.test(String(r[15]||""))};
  });
  if (key === "storage") {
    const units = [], spots = [];
    let inSpots = false;
    for (const r of rows.slice(1)) {
      if (!r || !r.length || !String(r[0]||"").trim()) continue;
      if (/next open spot/i.test(r[0])) { inSpots = true; continue; }
      if (inSpots) spots.push({label:r[0], loc:r[1]||""});
      else units.push({unit:r[0], spec:r[1]||"", rule:r[2]||"", count:money(r[3]), max:money(r[4]), status:r[7]||""});
    }
    return {units, spots};
  }
  if (key === "grading") return body.map(r => ({name:r[0], set:r[1]||"", num:r[2]||"", raw:money(r[3]), p10:money(r[4]), p9:money(r[5]), p8:money(r[6]),
      net10:money(r[7]), net9:money(r[8]), rec:String(r[9]||"").toUpperCase(), ai:r[10]||"", hands:r[11]||"", send:r[12]||"", step:r[13]||"", grade:r[14]||"", housing:r[15]||""}));
  if (key === "log") return body.map(r => ({date:r[0], items:money(r[1]), value:money(r[2]), note:r[3]||""}));
  return body;
}

/* ---------- loading ---------- */
/* Fetches every tab in one request to Code.gs (doGet with ?data=1). Keeps the last good copy if a refresh fails. */
async function fetchData(){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(API + "?data=1&t=" + Date.now(), {cache:"no-store", signal:ctl.signal});
    if (!res.ok) throw new Error("The sheet answered with error " + res.status + ".");
    return await res.json();
  } finally { clearTimeout(timer); }
}
function apply(d){
  const at = (d && d.at) || Date.now();
  for (const k of KEYS) {
    const rows = d && d[k];
    if (Array.isArray(rows)) { S.data[k] = parse(k, rows); S.at[k] = at; S.err[k] = null; }
    else { S.err[k] = {code:"missing_tab", message:""}; }
  }
  S.mode = S.data.collection ? "ready" : "error";
}
function loadAll(){
  if (S.busy || S.fallback) return;
  S.busy = true; render();
  fetchData().then(d => {
    S.busy = false;
    apply(d);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch(e) {}
    render();
  }).catch(e => {
    S.busy = false;
    // Never loaded here before (e.g. Code.gs not updated yet): show the Apps Script version instead.
    if (!S.data.collection) { useFallback(); return; }
    const err = {code:"error", message: e && e.name === "AbortError" ? "The sheet took too long to answer." : ((e && e.message) || "")};
    KEYS.forEach(k => S.err[k] = err);
    render();
  });
}
function useFallback(){
  S.fallback = true;
  document.body.innerHTML = `<iframe src="${API}" title="Jeff's Pokémon Tracker" allow="fullscreen" style="position:fixed;inset:0;width:100%;height:100%;border:0;display:block"></iframe>`;
}
function boot(){
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c) apply(c); } catch(e) {}
  render();
  loadAll();
  // Refresh every 5 minutes while the app is on screen, and when you come back to it.
  setInterval(() => { if (!document.hidden) loadAll(); }, 300000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && S.at.collection && Date.now() - S.at.collection > 120000) loadAll();
  });
}

/* ---------- render shell ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  $("stamp").textContent = S.busy ? "" : ago(S.at.collection);
  const rb = $("refresh");
  rb.disabled = S.busy;
  rb.innerHTML = S.busy ? '<span class="spin" aria-hidden="true"></span> Loading' : "Refresh";

  const main = $("main");
  if (!S.data.collection) {
    main.dataset.view = "state";
    main.innerHTML = stateView();
    const a = $("act"); if (a) a.onclick = () => loadAll();
    return;
  }
  if (S.tab === "collection" && main.dataset.view === "collection" && $("q")) { updateList(); return; }
  main.dataset.view = S.tab;
  main.innerHTML = ({overview:viewOverview, collection:viewCollection, binder:viewBinder, grading:viewGrading, storage:viewStorage}[S.tab] || viewOverview)();
  wire();
  hydrate(main);
}

function stateView(){
  if (S.mode === "loading" || (S.busy && !S.err.collection)) {
    return `<section class="hero"><div class="eyebrow">Collection value</div><div class="skel" style="height:48px;width:55%;margin-top:10px"></div><div class="skel" style="width:70%;margin-top:14px"></div></section>
      <section class="panel"><div class="skel" style="width:40%"></div><div class="skel" style="margin-top:14px"></div><div class="skel" style="margin-top:10px;width:80%"></div></section>
      <p class="note">Reading “Pokemon tracker Jeff” from Google Sheets…</p>`;
  }
  const e = S.err.collection || {code:"error"};
  if (e.code === "missing_tab") return msg("No Collection tab found", "The sheet opened, but it has no tab named “Collection”. If you renamed it, change the name back or update Code.gs.", "Try again");
  return msg("The sheet couldn't be read", (e.message ? e.message + " " : "") + "Check your connection and that “Pokemon tracker Jeff” still exists, then try again.", "Try again");
}
function msg(title, text, action){
  return `<div class="state"><h2>${esc(title)}</h2><p>${esc(text)}</p>${action ? `<button class="btn primary" id="act" type="button">${esc(action)}</button>` : ""}<a class="note" href="${SHEET_URL}" target="_blank" rel="noopener">Open the sheet in Google Sheets</a></div>`;
}
function secErr(key, label){
  const e = S.err[key];
  if (!e) return "";
  return `<div class="secerr">${esc(label)} didn't load (${esc(e.code.replace(/_/g," "))}). ${S.data[key] ? "Showing the last copy." : "Tap Refresh to try again."}</div>`;
}

/* ---------- derived ---------- */
function stats(){
  const c = S.data.collection || [];
  const t = {}; TIERS.concat([{k:"other"}]).forEach(x => t[x.k] = {qty:0, value:0, rows:0});
  let qty = 0, value = 0;
  for (const r of c) { qty += r.qty; value += r.total; const b = t[r.tier]; b.qty += r.qty; b.value += r.total; b.rows++; }
  return {c, t, qty, value};
}

/* ---------- views ---------- */
function viewOverview(){
  const {c, t, qty, value} = stats();
  const sealedQty = t.sealed.qty, cardQty = qty - sealedQty;
  const stack = TIERS.map(x => `<span class="c-${x.k}" style="width:${value ? (t[x.k].value / value * 100).toFixed(2) : 0}%" title="${esc(x.label)}"></span>`).join("");
  const tiers = TIERS.map(x => `<div class="tier"><i class="c-${x.k}"></i><span class="l">${x.label}</span><span class="v">${usd(t[x.k].value)}</span><span class="s">${x.sub}</span><span class="c">${int(t[x.k].qty)} ${x.k === "sealed" ? "items" : "cards"}</span></div>`).join("");

  const sets = {};
  c.filter(r => r.tier !== "sealed").forEach(r => { const k = r.set.replace(/\s*\(.*\)\s*$/, "") || "Unknown"; sets[k] = (sets[k] || 0) + r.total; });
  const top = Object.entries(sets).sort((a,b) => b[1]-a[1]).slice(0, 8);
  const max = top.length ? top[0][1] : 1;
  const setBars = top.map(([n,v]) => `<div class="bar"><span class="n" title="${esc(n)}">${esc(n)}</span><span class="t"><span style="width:${(v/max*100).toFixed(1)}%"></span></span><span class="v">${usd(v)}</span></div>`).join("");

  const hits = c.filter(r => r.tier !== "sealed" && !/\(count\)/i.test(r.name)).sort((a,b) => b.price - a.price).slice(0, 6)
    .map(r => `<li class="t-${r.tier} tap" data-i="${r.i}"><span class="thumb sm"${picAttrs(r)}></span><span class="nm">${esc(r.name)}</span><span class="px">${usd(r.price)}</span><span class="meta">${esc(r.set)} · ${esc(r.num)} · <span class="pin"><i></i>${esc(r.loc)}</span></span></li>`).join("");

  const needSleeve = c.filter(r => r.sleeve);
  const nsQty = needSleeve.reduce((a,r) => a + r.qty, 0);

  return `

    <div class="big">${usd(value)}</div>
    <div class="sub"><span><b>${int(cardQty)}</b> cards</span><span><b>${int(sealedQty)}</b> sealed items</span><span><b>${int(c.length)}</b> rows</span>${S.data.log && S.data.log.length ? `<span>Last price check <b>${esc(S.data.log[S.data.log.length-1].date)}</b></span>` : ""}</div>
  </section>
  <section class="panel">
    <h2>Where the value sits</h2>
    <div class="stack" role="img" aria-label="Value split by storage tier">${stack}</div>
    <div class="tiers">${tiers}</div>
  </section>
  <div class="grid2">
    <section class="panel"><h2>Top cards</h2><ul class="hits pics">${hits || '<li class="muted">No singles yet.</li>'}</ul></section>
    <section class="panel"><h2>Value by set</h2><div class="bars">${setBars || '<p class="note">No singles yet.</p>'}</div></section>
  </div>
  <div class="grid2">
    <section class="panel">
      <h2>To do</h2>
      <ul class="hits">
        <li><span class="nm">Penny-sleeve the holos</span><span class="px">${int(nsQty)}</span><span class="meta">${needSleeve.length} rows in Bulk Row 1 are still raw. <button class="btn" type="button" data-go="collection" data-filter="sleeve" style="margin-left:4px">Show them</button></span></li>
        <li><span class="nm">Grading candidates to screen</span><span class="px">${S.data.grading ? int(screen) : "–"}</span><span class="meta">Check centering and surface before deciding. <button class="btn" type="button" data-go="grading" style="margin-left:4px">Open grading</button></span></li>

function logView(){
  const err = secErr("log","Price log");
  const L = (S.data.log || []).filter(x => x.value > 0);
  if (!L.length) return err || '<p class="note">No price checks logged yet.</p>';
  if (L.length < 2) {
    const x = L[0];
    return `${err}<p style="margin:0"><span class="num" style="font-size:22px;font-weight:500">${usd(x.value)}</span> <span class="muted">on ${esc(x.date)}</span></p><p class="note">The trend line starts after the next Sunday price check adds a second point.</p>`;
  }
  const W = 560, H = 150, pl = 8, pr = 8, pt = 16, pb = 26;
  const vs = L.map(x => x.value), lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || hi * .1 || 1;
  const X = i => pl + i * (W - pl - pr) / (L.length - 1);
  const Y = v => pt + (1 - (v - (lo - span*.1)) / (span*1.2)) * (H - pt - pb);
  const pts = L.map((x,i) => `${X(i).toFixed(1)},${Y(x.value).toFixed(1)}`).join(" ");
  const last = L[L.length-1], first = L[0], d = last.value - first.value;
  return `${err}<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Collection value from ${esc(first.date)} to ${esc(last.date)}">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    <polygon points="${X(0)},${H-pb} ${pts} ${X(L.length-1)},${H-pb}" fill="var(--accent-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(L.length-1)}" cy="${Y(last.value)}" r="4.5" fill="var(--accent)"/>
    <text x="${pl}" y="${H-8}">${esc(first.date)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${esc(last.date)}</text>
  </svg><p class="note" style="margin:6px 0 0">${usd(last.value)} now · <span class="${d >= 0 ? "pos" : "neg"}">${d >= 0 ? "+" : "−"}${usd(Math.abs(d))}</span> since ${esc(first.date)}</p>`;
}

const FILTERS = [
  {k:"all", label:"All"}, {k:"top", label:"Top loaders"}, {k:"binder", label:"Binder"},
  {k:"bulk", label:"Bulk box"}, {k:"sealed", label:"Sealed"}, {k:"sleeve", label:"Needs sleeve"}
];
function viewCollection(){
  return `<div class="toolbar">
    <label class="search" for="q"><span class="muted" aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search name, set, number or location" value="${esc(S.q)}" autocomplete="off"></label>
    <div class="chips" role="group" aria-label="Filter">${FILTERS.map(f => `<button type="button" class="chip" data-filter="${f.k}" aria-pressed="${S.filter === f.k}">${["top","binder","bulk","sealed"].includes(f.k) ? `<i class="c-${f.k}"></i>` : ""}${f.label}</button>`).join("")}</div>
    <div class="sortrow"><span id="count"></span><label>Sort <select id="sort"><option value="value">Highest value</option><option value="name">Name A–Z</option><option value="set">Set</option><option value="loc">Location</option></select></label></div>
  </div>
  <ul class="list" id="colList"></ul>`;
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  let rows = (S.data.collection || []).filter(r => {
    if (S.filter === "sleeve" ? !r.sleeve : (S.filter !== "all" && r.tier !== S.filter)) return false;
    if (!q) return true;
    return [r.name, r.set, r.num, r.rarity, r.loc].join(" ").toLowerCase().includes(q);
  });
  const by = {
    value: (a,b) => b.price - a.price || b.total - a.total,
    name: (a,b) => a.name.localeCompare(b.name),
    set: (a,b) => a.set.localeCompare(b.set) || String(a.num).localeCompare(String(b.num), undefined, {numeric:true}),
    loc: (a,b) => a.loc.localeCompare(b.loc, undefined, {numeric:true})
  }[S.sort];
  return rows.sort(by);
}
function updateList(){
  const rows = filtered();
  const qty = rows.reduce((a,r) => a + r.qty, 0), val = rows.reduce((a,r) => a + r.total, 0);
  $("count").textContent = `${rows.length} rows · ${int(qty)} items · ${usd(val)}`;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === S.filter)));
  $("colList").innerHTML = rows.length ? rows.map(r => `
    <li class="row t-${r.tier} tap" data-i="${r.i}" tabindex="0">
      <span class="thumb"${picAttrs(r)}></span>
      <div><div class="nm">${esc(r.name)}</div><div class="meta">${esc(r.set)}${r.num ? " · " + esc(r.num) : ""}${r.rarity ? " · " + esc(r.rarity) : ""}${r.cond && r.cond !== "NM" ? " · " + esc(r.cond) : ""}</div></div>
      <div class="val"><div class="px">${usd(r.price)}</div>${r.qty > 1 ? `<div class="qty">×${int(r.qty)} · ${usd(r.total)}</div>` : ""}</div>
      <div class="loc"><span class="pin"><i></i>${esc(r.loc || "No location")}</span>${r.sleeve ? '<span class="flag">Needs penny sleeve</span>' : ""}</div>
    </li>`).join("") : `<li class="empty">Nothing matches “${esc(S.q)}”.</li>`;
  hydrate($("colList"));
}

function viewBinder(){
  const c = (S.data.collection || []).filter(r => r.page);
  const st = S.data.storage;
  const nextLoc = st && st.spots.find(s => /binder/i.test(s.label));
  const nm = nextLoc && String(nextLoc.loc).match(/P\s*(\d+)\s*S\s*(\d+)/i);
  const next = nm ? {p:+nm[1], s:+nm[2]} : null;
  const used = c.length, maxP = Math.max(1, ...c.map(r => r.page), next ? next.p : 1);
  if (S.page == null) S.page = next ? next.p : 1;
  const P = S.page;
  const onPage = {}; c.filter(r => r.page === P).forEach(r => onPage[r.slot] = r);
  let slots = "";
  for (let s = 1; s <= 9; s++) {
    const r = onPage[s];
    if (r) slots += `<div class="slot fill tap" data-i="${r.i}"><span class="art"${picAttrs(r)}></span><span class="sn">S${s}</span><span class="nm">${esc(r.name)}</span><span class="meta">${esc(r.set)}<br>${esc(r.num)}</span><span class="px">${usd(r.price)}</span></div>`;
    else if (next && next.p === P && next.s === s) slots += `<div class="slot open next"><span class="sn">S${s}</span>Next open</div>`;
    else slots += `<div class="slot open"><span class="sn">S${s}</span>Open</div>`;
  }
  const pageVal = Object.values(onPage).reduce((a,r) => a + r.total, 0);
  const pages = Array.from({length: Math.min(40, maxP + 1)}, (_, i) => i + 1).map(p => {
    const n = c.filter(r => r.page === p).length;
    return `<button type="button" data-page="${p}" aria-current="${p === P}" class="${n === 9 ? "full" : ""}" aria-label="Page ${p}, ${n} of 9 filled">${p}</button>`;
  }).join("");
  return `<section class="panel">
    <div class="pager">
      <div><div class="eyebrow">Vault X 9-pocket binder</div><div class="pg">Page ${P}</div></div>
      <div style="display:flex;gap:6px"><button class="btn" type="button" data-page="${Math.max(1,P-1)}" ${P <= 1 ? "disabled" : ""}>← Prev</button><button class="btn" type="button" data-page="${Math.min(40,P+1)}" ${P >= 40 ? "disabled" : ""}>Next →</button></div>
    </div>
    <p class="note" style="margin:6px 0 0">${Object.keys(onPage).length} of 9 pockets filled · ${usd(pageVal)} on this page · ${used} of 360 slots used${next ? ` · next card goes in <b>P${next.p} S${next.s}</b>` : ""}</p>
    <div class="sheet" role="list" aria-label="Binder page ${P}">${slots}</div>
    <div class="pages" aria-label="Binder pages">${pages}</div>
    ${secErr("storage","Next open slot")}
  </section>`;
}

function viewGrading(){
  const g = S.data.grading;
  if (!g) return `<section class="panel"><h2>Grading</h2>${secErr("grading","Grading tab") || '<p class="note">Loading…</p>'}</section>`;
  if (!g.length) return `<section class="panel"><h2>Grading</h2><p class="note">No cards are flagged for grading yet. Cards worth $20 or more show up here automatically.</p></section>`;
  const pill = r => r === "GRADE" ? "p-grade" : r === "GAMBLE" ? "p-gamble" : "p-skip";
  const sign = n => `<span class="${n >= 0 ? "pos" : "neg"}">${n >= 0 ? "+" : "−"}${usd(Math.abs(n))}</span>`;
  return `<p class="note" style="margin:0">GRADE pays even at a PSA 9. GAMBLE only pays at a PSA 10, so send it only if it looks flawless. Net figures are after the PSA fee, shipping and selling fees.</p>
  ${secErr("grading","Grading")}
  <div class="grid2">${g.map(x => `
    <article class="gcard">
      <div class="gtop"><div style="display:flex;gap:10px;min-width:0"><span class="thumb"${picAttrs({tier:"top", name:x.name, set:x.set, num:x.num})}></span><div><h3 style="font-size:16px">${esc(x.name)}</h3><div class="note">${esc(x.set)} · ${esc(x.num)} · <span class="pin t-top"><i></i>${esc(x.housing)}</span></div></div></div><span class="pill ${pill(x.rec)}">${esc(x.rec || "—")}</span></div>
      <div class="gtbl">
        <div><div class="k">Raw NM</div><div class="v">${usd(x.raw)}</div></div>
        <div><div class="k">PSA 10</div><div class="v">${usd(x.p10)}</div></div>
        <div><div class="k">PSA 9</div><div class="v">${usd(x.p9)}</div></div>
        <div><div class="k">Net at 10</div><div class="v">${sign(x.net10)}</div></div>
        <div><div class="k">Net at 9</div><div class="v">${sign(x.net9)}</div></div>
        <div><div class="k">PSA 8</div><div class="v">${usd(x.p8)}</div></div>
      </div>
      <div class="steps"><span>Send: <b>${esc(x.send || "—")}</b></span>${x.ai ? `<span>AI screen: ${esc(x.ai)}</span>` : ""}${x.hands ? `<span>Hands-on: ${esc(x.hands)}</span>` : ""}${x.step ? `<span>Step: ${esc(x.step)}</span>` : ""}${x.grade ? `<span>Grade: <b>${esc(x.grade)}</b></span>` : ""}</div>
    </article>`).join("")}</div>`;
}

function viewStorage(){
  const st = S.data.storage;
  const {c, t} = stats();
  const ns = c.filter(r => r.sleeve);
  const colorFor = u => /binder/i.test(u) ? "c-binder" : /bulk/i.test(u) ? "c-bulk" : /top/i.test(u) ? "c-top" : /sealed/i.test(u) ? "c-sealed" : "c-other";
  const units = st ? st.units.map(u => {
    const pct = u.max ? Math.min(100, u.count / u.max * 100) : 0;
    return `<div class="unit"><span class="l">${esc(u.unit)}</span><span class="r">${int(u.count)} / ${int(u.max)}</span><span class="s">${esc(u.spec)} · ${esc(u.rule)}</span><span class="t"><span class="${colorFor(u.unit)}" style="width:${pct.toFixed(1)}%"></span></span></div>`;
  }).join("") : "";
  const spots = st && st.spots.length ? `<div class="spots">${st.spots.map(s => `<div class="spot"><div class="eyebrow">${esc(s.label)}</div><div class="v">${esc(s.loc)}</div></div>`).join("")}</div>` : "";
  return `${spots ? `<section class="panel"><h2>Next open spots</h2>${spots}</section>` : ""}
  <section class="panel"><h2>Storage capacity</h2>${secErr("storage","Storage tab")}<div class="units">${units || '<p class="note">Loading…</p>'}</div></section>
  <section class="panel"><h2>Needs a penny sleeve</h2>
    <p class="note" style="margin-top:0">Holos and reverse holos in Bulk Row 1 should be sleeved even under $2. ${int(ns.reduce((a,r)=>a+r.qty,0))} cards across ${ns.length} rows are still raw.</p>
    <ul class="hits">${ns.sort((a,b)=>a.loc.localeCompare(b.loc)).map(r => `<li><span class="nm">${esc(r.name)}</span><span class="px">×${int(r.qty)}</span><span class="meta"><span class="pin"><i></i>${esc(r.loc)}</span></span></li>`).join("") || '<li class="muted">Everything is sleeved.</li>'}</ul>
  </section>`;
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    if (b.dataset.filter) { S.filter = b.dataset.filter; S.q = ""; }
    setTab(b.dataset.go);
  });
  document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => { S.page = +b.dataset.page; render(); });
  if (S.tab === "collection") {
    const q = $("q");
    q.oninput = () => { S.q = q.value; updateList(); };
    document.querySelectorAll(".chip").forEach(b => b.onclick = () => { S.filter = b.dataset.filter; updateList(); });
    const so = $("sort"); so.value = S.sort; so.onchange = () => { S.sort = so.value; updateList(); };
    updateList();
  }
}
function setTab(t){
  S.tab = t;
  try { localStorage.setItem("pkt-tab", t); } catch(e) {}
  $("main").dataset.view = "";
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("main").addEventListener("click", e => { const t = e.target.closest("[data-i]"); if (t && !e.target.closest("button")) openDetail(+t.dataset.i); });
$("main").addEventListener("keydown", e => { const t = e.target.closest("[data-i]"); if (t && e.key === "Enter") openDetail(+t.dataset.i); });
$("refresh").onclick = () => loadAll(true);
setInterval(() => { if (!S.busy) $("stamp").textContent = ago(S.at.collection); }, 60000);
boot();
</script>

</body>
</html>
